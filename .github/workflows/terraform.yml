name: Terraform CI/CD

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

# Required so the job can request a GitHub OIDC token to exchange for
# temporary AWS credentials — no long-lived AWS secrets needed.
permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-west-2
  TF_WORKING_DIR: terraform
  # Required vars for the sg-approval workflow (no defaults in variables.tf).
  # Set SG_APPROVER_EMAIL / SG_SENDER_EMAIL under Settings > Secrets and
  # variables > Actions > Variables. github_owner is derived automatically.
  TF_VAR_approver_email: ${{ vars.SG_APPROVER_EMAIL }}
  TF_VAR_sender_email: ${{ vars.SG_SENDER_EMAIL }}
  TF_VAR_github_owner: ${{ github.repository_owner }}

jobs:
  terraform:
    name: Terraform Plan/Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TEMPORARY DEBUG STEP — remove once OIDC assume-role is working.
      # Prints the actual "sub"/"aud"/"iss" claims GitHub is sending so you
      # can compare them character-for-character against the IAM role's
      # trust policy condition.
      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)
          # base64url -> base64 padding fix, then decode
          PAYLOAD="${PAYLOAD//-/+}"
          PAYLOAD="${PAYLOAD//_/\/}"
          MOD=$(( ${#PAYLOAD} % 4 ))
          if [ $MOD -eq 2 ]; then PAYLOAD="${PAYLOAD}=="; elif [ $MOD -eq 3 ]; then PAYLOAD="${PAYLOAD}="; fi
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, iss, repository, ref, event_name}'
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::250251693220:role/test-github-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -input=false

      - name: Adopt existing API Gateway Lambda permission
        run: |
          set +e
          import_output=$(terraform import aws_lambda_permission.allow_apigw_invoke_approval_handler sg-approval-handler/AllowAPIGatewayInvoke 2>&1)
          import_exit=$?
          set -e

          if [ "$import_exit" -eq 0 ]; then
            echo "Imported existing API Gateway Lambda permission into the local Terraform state."
          # Terraform currently reports an absent remote object via CLI text
          # rather than a dedicated exit code. Re-validate these patterns when
          # upgrading Terraform beyond the v1.9.x series used in CI.
          elif printf '%s' "$import_output" | grep -Eq 'Cannot import non-existent remote object|no object exists with the given id'; then
            echo "API Gateway Lambda permission does not exist yet; Terraform will create it if needed."
          else
            printf '%s\n' "$import_output"
            exit "$import_exit"
          fi

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e
          terraform plan -no-color -input=false -detailed-exitcode 2>&1 | tee plan_output.txt
          pipe_status=("${PIPESTATUS[@]}")
          set -e
          exit_code=${pipe_status[0]}
          tee_exit=${pipe_status[1]}

          if [ "$tee_exit" -ne 0 ]; then
            echo "Failed to write Terraform plan output."
            exit "$tee_exit"
          fi

          case "$exit_code" in
            0)
              echo "summary=no changes" >> "$GITHUB_OUTPUT"
              echo "Terraform plan completed with no changes."
              ;;
            2)
              echo "summary=changes pending" >> "$GITHUB_OUTPUT"
              echo "Terraform plan completed with pending changes."
              ;;
            *)
              exit "$exit_code"
              ;;
          esac

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read the plan directly from disk instead of piping it through
            // $GITHUB_OUTPUT — large plans can silently blow past GitHub's
            // environment-file size limit and kill the step with no error text.
            const planPath = path.join(process.env.TF_WORKING_DIR, 'plan_output.txt');
            let planOutput = fs.readFileSync(planPath, 'utf8');

            const maxLen = 60000; // stay under GitHub's ~65536 comment body limit
            if (planOutput.length > maxLen) {
              planOutput = planOutput.slice(0, maxLen) + '\n\n... (truncated, see full log in the Actions run)';
            }

            const output = `#### Terraform Format 🖌 \`${{ steps.fmt.outcome }}\`
            #### Terraform Plan 📖 \`${{ steps.plan.outputs.summary }}\`

            <details><summary>Show Plan</summary>

            \`\`\`
            ${planOutput}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
